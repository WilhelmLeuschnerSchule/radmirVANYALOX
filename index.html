        // 2. Отображаем все машины на странице при загрузке
        const carsGrid = document.getElementById('carsGrid');
        carsData.forEach(car => {
            const card = document.createElement('div');
            card.className = 'car-card';
            card.id = car.id; // Присваиваем ID карточке для плавной прокрутки к ней
          card.innerHTML = `
    <h3>${car.name}</h3>
    <p>Цена: ${car.price}</p>
    
`;
            carsGrid.appendChild(card);
        });

        // 3. Настраиваем Fuse.js для «умного» поиска
        const options = {
            keys: ['name'], // Ищем по полю "name"
            threshold: 0.4  // Уровень чувствительности к ошибкам (0.0 - точное совпадение, 1.0 - найдет всё подряд)
        };
        const fuse = new Fuse(carsData, options);

        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestions');

        // 4. Логика ввода текста
        searchInput.addEventListener('input', () => {
            const query = searchInput.value;
            
            if (query.length < 1) {
                suggestionsBox.style.display = 'none';
                return;
            }

            // Ищем совпадения с учетом опечаток
            const results = fuse.search(query);

            // Очищаем старые подсказки
            suggestionsBox.innerHTML = '';

            if (results.length > 0) {
                suggestionsBox.style.display = 'block';
                
                // Выводим первые 5 подходящих результатов в выпадающий список
                results.slice(0, 5).forEach(result => {
                    const car = result.item;
                    const div = document.createElement('div');
                    div.textContent = car.name;
                    
                    // Клик по подсказке переносит нас к машине
                    div.addEventListener('click', () => {
                        searchInput.value = car.name;
                        suggestionsBox.style.display = 'none';
                        
                        // Скроллим к нужной машине
                        const element = document.getElementById(car.id);
                        element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        
                        // Небольшой визуальный эффект (подсветка)
                        element.style.backgroundColor = '#e6f2ff';
                        setTimeout(() => { element.style.backgroundColor = 'white'; }, 1500);
                    });
                    
                    suggestionsBox.appendChild(div);
                });
            } else {
                suggestionsBox.style.display = 'none';
            }
        });

        // Закрываем список подсказок, если кликнули мимо строки поиска
        document.addEventListener('click', (e) => {
            if (e.target !== searchInput) {
                suggestionsBox.style.display = 'none';
            }
        });
    </script>
